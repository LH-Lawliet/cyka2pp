name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # g++-14: full libstdc++ with std::expected (C++23/26)
          sudo apt-get install -y cmake ninja-build g++-14

      - name: Configure (x86-64-v2, fetched deps, static libstdc++)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCYKA_FETCH_DEPS=ON \
            -DCYKA_STATIC=ON \
            -DCYKA_MARCH=x86-64-v2

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke CLI
        run: |
          ./build/cyka2pp -h
          file ./build/cyka2pp
          ldd ./build/cyka2pp || true
