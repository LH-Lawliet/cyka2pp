name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep format/tidy on a modern Clang; Ubuntu apt clang-18 is too old for this tree.
  LLVM_VERSION: "22"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y "clang-format-${LLVM_VERSION}"

      - name: Check formatting
        run: |
          mapfile -d '' files < <(
            find include src tests \( -name '*.hpp' -o -name '*.cpp' \) -print0
          )
          "clang-format-${LLVM_VERSION}" --dry-run --Werror "${files[@]}"

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            "clang-${LLVM_VERSION}" \
            "clang-tidy-${LLVM_VERSION}" \
            "clang-tools-${LLVM_VERSION}"
          sudo ln -sf "$(command -v "clang-tidy-${LLVM_VERSION}")" /usr/local/bin/clang-tidy
          sudo ln -sf "$(command -v "run-clang-tidy-${LLVM_VERSION}")" /usr/local/bin/run-clang-tidy

      - name: Configure (compile_commands for tidy)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCYKA_FETCH_DEPS=ON \
            -DCYKA_STATIC=OFF \
            -DCYKA_MARCH=x86-64-v2

      - name: Build deps / generate objects for compile DB consumers
        run: cmake --build build -j"$(nproc)" --target cyka_core

      - name: clang-tidy (warnings as errors)
        run: cmake --build build --target cyka_tidy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # g++-14: full libstdc++ with std::expected (C++23/26)
          sudo apt-get install -y cmake ninja-build g++-14

      - name: Configure (x86-64-v2, fetched deps, static libstdc++)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCYKA_FETCH_DEPS=ON \
            -DCYKA_STATIC=ON \
            -DCYKA_MARCH=x86-64-v2

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke CLI
        run: |
          ./build/cyka2pp -h
          file ./build/cyka2pp
          ldd ./build/cyka2pp || true
