name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same Clang as CI — Ubuntu has no g++-16 package for noble.
  LLVM_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - march: x86-64-v2
            artifact: cyka2pp-linux-x86_64-v2
          - march: x86-64-v3
            artifact: cyka2pp-linux-x86_64-v3
          - march: x86-64-v4
            artifact: cyka2pp-linux-x86_64-v4
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build "clang-${LLVM_VERSION}"

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCYKA_FETCH_DEPS=ON \
            -DCYKA_STATIC=ON \
            -DCYKA_MARCH=${{ matrix.march }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests (v2 only — v4 may not run on this runner)
        if: matrix.march == 'x86-64-v2'
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          strip -s build/cyka2pp || true
          mkdir -p dist
          cp build/cyka2pp "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          (
            cd dist
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          )
          file "dist/${{ matrix.artifact }}"
          ldd "dist/${{ matrix.artifact }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # Create/update the release metadata first (no assets). softprops uploads
      # all files concurrently by default; GitHub's upload API intermittently
      # returns HTML unicorn 5xx under that parallel load — one tiny .sha256 can
      # succeed while a binary fails in the same batch.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Upload release assets (sequential + retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mapfile -d '' files < <(find artifacts -type f -print0 | sort -z)
          if ((${#files[@]} == 0)); then
            echo "no artifacts to upload" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "Uploading ${name}..."
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if gh release upload "$tag" "$f" --clobber; then
                ok=1
                break
              fi
              sleep=$((attempt * 15))
              echo "upload failed (attempt ${attempt}/8), retry in ${sleep}s..."
              sleep "$sleep"
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "failed to upload ${name} after retries" >&2
              exit 1
            fi
          done
